name: Test Setup

on:
  workflow_dispatch:   # Manual Run workflow button

  schedule:
    # Runs every day at 9:00 UTC
    - cron: "0 9 * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      OWM_API_key: ${{ secrets.OWM_API_key }}
      NEW_SID: ${{ secrets.NEW_SID }}
      NEW_AUTH_KEY: ${{ secrets.NEW_AUTH_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets are configured
        run: |
          if [ -z "$OWM_API_key" ]; then
            echo "❌ OpenWeather API key is missing"
            exit 1
          else
            echo "✅ OpenWeather API key is configured"
          fi

          if [ -z "$NEW_SID" ]; then
            echo "❌ Twilio SID is missing"
            exit 1
          else
            echo "✅ Twilio SID is configured"
          fi

          if [ -z "$NEW_AUTH_KEY" ]; then
            echo "❌ Twilio Auth Token is missing"
            exit 1
          else
            echo "✅ Twilio Auth Token is configured"
          fi

      - name: Run weather script
        run: python main.py
